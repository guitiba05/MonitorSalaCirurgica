<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 860" width="1200" height="860" font-family="Segoe UI, system-ui, -apple-system, Roboto, Arial, sans-serif">
  <title>Arquitetura do Monitor de Sala Cirúrgica</title>
  <desc>Camadas IoT, back-end FIWARE na EC2, aplicação ASP.NET Core e interfaces (navegador e Alexa), com protocolos, portas, fluxo de dados (1 a 6), de comandos (A a C) e de provisionamento (P).</desc>
  <defs>
    <marker id="seta-dado" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0f5e6e"/></marker>
    <marker id="seta-cmd" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b42318"/></marker>
    <marker id="seta-prov" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b4fa0"/></marker>
    <marker id="seta-outra" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5b6b78"/></marker>
    <style>
      .faixa-titulo { font-size: 12px; font-weight: 700; letter-spacing: .06em; fill: #5b6b78; }
      .caixa { fill: #ffffff; stroke: #9fb0bb; stroke-width: 1.2; }
      .caixa-app { fill: #ffffff; stroke: #0f5e6e; stroke-width: 1.6; }
      .interna { fill: #eef6f7; stroke: #a9cdd3; stroke-width: 1; }
      .nome { font-size: 14px; font-weight: 650; fill: #17232d; }
      .sub { font-size: 12px; fill: #46555f; }
      .rotulo { font-size: 11.5px; fill: #17232d; paint-order: stroke; stroke: #ffffff; stroke-width: 4px; stroke-linejoin: round; }
      .dado { stroke: #0f5e6e; stroke-width: 2; fill: none; }
      .cmd { stroke: #b42318; stroke-width: 2; fill: none; }
      .prov { stroke: #6b4fa0; stroke-width: 2; fill: none; }
      .outra { stroke: #5b6b78; stroke-width: 1.6; fill: none; }
      .opcional { stroke-dasharray: 6 4; }
      .num-dado { fill: #0f5e6e; font-weight: 700; }
      .num-cmd { fill: #b42318; font-weight: 700; }
      .num-prov { fill: #6b4fa0; font-weight: 700; }
    </style>
  </defs>

  <rect width="1200" height="860" fill="#ffffff"/>

  <!-- ================= Faixas (camadas) ================= -->
  <rect x="20" y="20" width="1160" height="110" rx="10" fill="#f4f6f8"/>
  <text x="36" y="40" class="faixa-titulo">INTERFACES</text>
  <rect x="20" y="145" width="1160" height="230" rx="10" fill="#eaf4f5"/>
  <text x="36" y="165" class="faixa-titulo">APLICAÇÃO · COMPUTADOR DA EQUIPE (ANALISTA 1)</text>
  <rect x="20" y="420" width="1160" height="250" rx="10" fill="#f2effa"/>
  <text x="36" y="440" class="faixa-titulo">BACK-END · AWS LEARNER LAB · EC2 · DOCKER (FIWARE MADE SIMPLE)</text>
  <rect x="20" y="715" width="1160" height="125" rx="10" fill="#f8f4ea"/>
  <text x="36" y="735" class="faixa-titulo">IoT · SALA CIRÚRGICA (ANALISTA 2)</text>

  <!-- ================= Interfaces ================= -->
  <rect x="60" y="52" width="250" height="60" rx="8" class="caixa"/>
  <text x="76" y="76" class="nome">Navegador</text>
  <text x="76" y="96" class="sub">equipe e professor · painel e telas</text>

  <rect x="560" y="52" width="230" height="60" rx="8" class="caixa" stroke-dasharray="6 4"/>
  <text x="576" y="76" class="nome">Voice Monkey (opcional)</text>
  <text x="576" y="96" class="sub">anúncio falado no Echo</text>

  <rect x="850" y="52" width="290" height="60" rx="8" class="caixa"/>
  <text x="866" y="76" class="nome">Echo + nuvem da Alexa</text>
  <text x="866" y="96" class="sub">skill “monitor cirúrgico” (pt-BR)</text>

  <!-- ================= Aplicação ================= -->
  <rect x="60" y="180" width="600" height="182" rx="10" class="caixa-app"/>
  <text x="76" y="203" class="nome">ASP.NET Core MVC 3.1 · http://localhost:5000 · login</text>

  <rect x="80" y="216" width="180" height="68" rx="6" class="interna"/>
  <text x="92" y="238" class="nome" font-size="13">Telas (MVC + Ajax)</text>
  <text x="92" y="257" class="sub" font-size="11">Dashboard, Salas, Inscrições,</text>
  <text x="92" y="273" class="sub" font-size="11">Consulta IoT, Limites, Alertas</text>

  <rect x="275" y="216" width="180" height="68" rx="6" class="interna"/>
  <text x="287" y="238" class="nome" font-size="13">SupervisorService</text>
  <text x="287" y="257" class="sub" font-size="11">a cada 10 s: média × limites</text>
  <text x="287" y="273" class="sub" font-size="11">prioridade, histerese, reenvio</text>

  <rect x="470" y="216" width="170" height="68" rx="6" class="interna"/>
  <text x="482" y="238" class="nome" font-size="13">AlexaSkill</text>
  <text x="482" y="257" class="sub" font-size="11">POST /api/alexa</text>
  <text x="482" y="273" class="sub" font-size="11">assinatura verificada</text>

  <rect x="80" y="294" width="560" height="52" rx="6" class="interna"/>
  <text x="92" y="316" class="nome" font-size="13">HelperFiware + SalaDAO, InscricaoDAO, MensagemIoTDAO</text>
  <text x="92" y="334" class="sub" font-size="11">IoT Agent :4041 · Orion :1026 · STH-Comet :8666 · fiware-service smart · servicepath /</text>

  <rect x="720" y="182" width="200" height="72" rx="8" class="caixa"/>
  <text x="736" y="205" class="nome">SQL Server / LocalDB</text>
  <text x="736" y="224" class="sub">Limite, ConfiguracaoSala,</text>
  <text x="736" y="240" class="sub">AlertaLog · PadraoDAO</text>

  <rect x="960" y="270" width="180" height="70" rx="8" class="caixa"/>
  <text x="976" y="294" class="nome">ngrok (túnel HTTPS)</text>
  <text x="976" y="313" class="sub">expõe só /api/alexa</text>
  <text x="976" y="329" class="sub">domínio estático gratuito</text>

  <!-- ================= Back-end ================= -->
  <rect x="60" y="460" width="240" height="72" rx="8" class="caixa"/>
  <text x="76" y="484" class="nome">IoT Agent UltraLight 2.0</text>
  <text x="76" y="503" class="sub">:4041 provisionamento</text>
  <text x="76" y="519" class="sub">:7896 UL por HTTP (só testes)</text>

  <rect x="420" y="460" width="240" height="72" rx="8" class="caixa"/>
  <text x="436" y="484" class="nome">Orion Context Broker</text>
  <text x="436" y="503" class="sub">:1026 · NGSI-v2 · estado atual</text>
  <text x="436" y="519" class="sub">urn:ngsi-ld:SalaCirurgica:001</text>

  <rect x="760" y="460" width="180" height="72" rx="8" class="caixa"/>
  <text x="776" y="484" class="nome">STH-Comet</text>
  <text x="776" y="503" class="sub">:8666 · histórico</text>
  <text x="776" y="519" class="sub">lastN / hLimit ≤ 100</text>

  <rect x="1000" y="460" width="160" height="72" rx="8" class="caixa"/>
  <text x="1016" y="484" class="nome">MongoDB histórico</text>
  <text x="1016" y="503" class="sub">mongo-db-sth</text>
  <text x="1016" y="519" class="sub">:27017 · com senha</text>

  <rect x="60" y="592" width="240" height="56" rx="8" class="caixa"/>
  <text x="76" y="615" class="nome">Mosquitto</text>
  <text x="76" y="634" class="sub">broker MQTT · :1883</text>

  <rect x="420" y="592" width="240" height="56" rx="8" class="caixa"/>
  <text x="436" y="615" class="nome">MongoDB contexto</text>
  <text x="436" y="634" class="sub">mongo-db · só rede interna</text>

  <!-- ================= IoT ================= -->
  <rect x="60" y="752" width="390" height="70" rx="8" class="caixa"/>
  <text x="76" y="776" class="nome">ESP32 · sala_cirurgica.ino</text>
  <text x="76" y="795" class="sub">DHT11 (D4) · LDR 0–100 % (D34)</text>
  <text x="76" y="811" class="sub">LED azul (D27) · buzzer passivo (D13)</text>

  <!-- Legenda -->
  <g transform="translate(500,752)">
    <rect width="660" height="70" rx="8" fill="#ffffff" stroke="#d6dde2"/>
    <line x1="16" y1="20" x2="46" y2="20" class="dado" marker-end="url(#seta-dado)"/>
    <text x="54" y="24" class="sub"><tspan class="num-dado">1–6</tspan> dados: medida → Orion → histórico → aplicação</text>
    <line x1="16" y1="42" x2="46" y2="42" class="cmd" marker-end="url(#seta-cmd)"/>
    <text x="54" y="46" class="sub"><tspan class="num-cmd">A–C</tspan> comando setAlert (luz, temp, umid, off) e confirmação</text>
    <line x1="400" y1="20" x2="430" y2="20" class="prov" marker-end="url(#seta-prov)"/>
    <text x="438" y="24" class="sub"><tspan class="num-prov">P</tspan> provisionamento (tela Salas)</text>
    <line x1="400" y1="42" x2="430" y2="42" class="outra opcional" marker-end="url(#seta-outra)"/>
    <text x="438" y="46" class="sub">opcional · seta sai de quem conecta</text>
    <text x="16" y="62" class="sub" font-size="11">A aplicação nunca fala direto com o ESP32: lê o Orion e o STH-Comet e manda o comando ao Orion.</text>
  </g>

  <!-- ================= Setas ================= -->
  <!-- Navegador -> aplicação -->
  <line x1="185" y1="112" x2="185" y2="178" class="outra" marker-end="url(#seta-outra)"/>
  <text x="195" y="150" class="rotulo">HTTP · $.ajax a cada 5 s</text>

  <!-- Aplicação -> Voice Monkey -> Echo (opcional) -->
  <line x1="620" y1="180" x2="620" y2="114" class="outra opcional" marker-end="url(#seta-outra)"/>
  <text x="630" y="150" class="rotulo">anúncio HTTPS</text>
  <line x1="790" y1="82" x2="848" y2="82" class="outra opcional" marker-end="url(#seta-outra)"/>

  <!-- Echo -> ngrok -> aplicação -->
  <line x1="1050" y1="112" x2="1050" y2="268" class="outra" marker-end="url(#seta-outra)"/>
  <text x="1060" y="190" class="rotulo">HTTPS POST</text>
  <line x1="960" y1="310" x2="662" y2="310" class="outra" marker-end="url(#seta-outra)"/>
  <text x="800" y="302" class="rotulo" text-anchor="middle">/api/alexa (JSON da Alexa)</text>

  <!-- Aplicação -> SQL -->
  <line x1="660" y1="218" x2="718" y2="218" class="outra" marker-end="url(#seta-outra)"/>
  <text x="689" y="210" class="rotulo" text-anchor="middle">ADO.NET</text>

  <!-- P: aplicação -> IoT Agent -->
  <line x1="180" y1="346" x2="180" y2="458" class="prov" marker-end="url(#seta-prov)"/>
  <text x="190" y="396" class="rotulo"><tspan class="num-prov">P</tspan> /iot/services e /iot/devices</text>

  <!-- A: aplicação -> Orion -->
  <line x1="540" y1="346" x2="540" y2="458" class="cmd" marker-end="url(#seta-cmd)"/>
  <text x="532" y="388" class="rotulo" text-anchor="end"><tspan class="num-cmd">A</tspan> PATCH setAlert · GET estado</text>
  <text x="532" y="404" class="rotulo" text-anchor="end">/v2/subscriptions · :1026</text>

  <!-- 6: aplicação -> STH-Comet -->
  <polyline points="620,346 620,400 850,400 850,458" class="dado" marker-end="url(#seta-dado)"/>
  <text x="640" y="392" class="rotulo"><tspan class="num-dado">6</tspan> GET histórico e médias · :8666</text>

  <!-- 3 e B: IoT Agent <-> Orion -->
  <line x1="300" y1="482" x2="418" y2="482" class="dado" marker-end="url(#seta-dado)"/>
  <text x="360" y="475" class="rotulo" text-anchor="middle"><tspan class="num-dado">3</tspan> atualiza</text>
  <line x1="420" y1="512" x2="302" y2="512" class="cmd" marker-end="url(#seta-cmd)"/>
  <text x="360" y="530" class="rotulo" text-anchor="middle"><tspan class="num-cmd">B</tspan> repassa setAlert</text>

  <!-- 4: Orion -> STH -->
  <line x1="660" y1="496" x2="758" y2="496" class="dado" marker-end="url(#seta-dado)"/>
  <text x="709" y="488" class="rotulo" text-anchor="middle"><tspan class="num-dado">4</tspan> notifica</text>
  <text x="709" y="514" class="rotulo" text-anchor="middle">httpCustom</text>

  <!-- 5: STH -> MongoDB histórico -->
  <line x1="940" y1="496" x2="998" y2="496" class="dado" marker-end="url(#seta-dado)"/>
  <text x="969" y="488" class="rotulo" text-anchor="middle"><tspan class="num-dado">5</tspan> grava</text>

  <!-- Orion -> MongoDB contexto -->
  <line x1="540" y1="532" x2="540" y2="590" class="outra" marker-end="url(#seta-outra)"/>
  <text x="550" y="566" class="rotulo">entidades e inscrições</text>

  <!-- 2 / C: IoT Agent -> Mosquitto -->
  <line x1="120" y1="532" x2="120" y2="590" class="dado" marker-end="url(#seta-dado)"/>
  <text x="130" y="558" class="rotulo"><tspan class="num-dado">2</tspan> assina /attrs</text>
  <text x="130" y="574" class="rotulo"><tspan class="num-cmd">C</tspan> publica /cmd</text>

  <!-- 1 / C: ESP32 -> Mosquitto -->
  <line x1="120" y1="752" x2="120" y2="650" class="dado" marker-end="url(#seta-dado)"/>
  <text x="130" y="690" class="rotulo"><tspan class="num-dado">1</tspan> publica /CIRURGIA01/sala01/attrs  t|23.5|h|58|l|42 e a|temp</text>
  <text x="130" y="706" class="rotulo"><tspan class="num-cmd">C</tspan> recebe /cmd  sala01@setAlert|temp · confirma em /cmdexe · MQTT :1883</text>
</svg>
